<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" role="img" aria-label="Completo talquino sonriente">
  <!-- Vapor saliendo del pan -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M92 52c-10-10 10-16 0-28s8-16 2-24"/>
    <path d="M130 46c-10-10 10-16 0-28s8-16 2-24"/>
    <path d="M168 52c-10-10 10-16 0-28s8-16 2-24"/>
  </g>
  <g stroke="#5a2d0c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Pan de atrás -->
    <rect x="30" y="78" width="200" height="62" rx="31" fill="#e9a95b"/>
    <!-- Vienesa asomándose por los lados -->
    <rect x="14" y="92" width="232" height="34" rx="17" fill="#e0664c"/>
    <!-- Chucrut -->
    <path d="M52 96c8-10 14 6 22-4s14 6 22-4 14 6 22-4 14 6 22-4 14 6 22-4 14 6 22-4 14 6 20-2" fill="none" stroke="#e8d98a" stroke-width="9"/>
    <!-- Tomate -->
    <g fill="#e53935" stroke-width="4">
      <circle cx="64" cy="88" r="8"/>
      <circle cx="96" cy="84" r="8"/>
      <circle cx="128" cy="86" r="8"/>
      <circle cx="160" cy="84" r="8"/>
      <circle cx="192" cy="88" r="8"/>
    </g>
    <!-- Mayo casera -->
    <path d="M56 78c10 8 18-8 28 0s18-8 28 0 18-8 28 0 18-8 28 0 18-8 28 0 14-6 20-2" fill="none" stroke="#fffbe8" stroke-width="10"/>
    <!-- Pan de adelante con la cara -->
    <rect x="26" y="112" width="208" height="82" rx="41" fill="#f6c983"/>
  </g>
  <!-- Brillo del pan -->
  <path d="M60 124c30-6 110-6 140 0" fill="none" stroke="#fff3d6" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <!-- Mejillas -->
  <ellipse cx="80" cy="164" rx="15" ry="10" fill="#ff8f8f" opacity="0.75"/>
  <ellipse cx="180" cy="164" rx="15" ry="10" fill="#ff8f8f" opacity="0.75"/>
  <!-- Ojos -->
  <g fill="#3a1d08">
    <ellipse cx="100" cy="146" rx="9" ry="12"/>
    <ellipse cx="160" cy="146" rx="9" ry="12"/>
  </g>
  <g fill="#ffffff">
    <circle cx="103" cy="141" r="3.5"/>
    <circle cx="163" cy="141" r="3.5"/>
  </g>
  <!-- Sonrisa -->
  <path d="M112 166c8 14 28 14 36 0" fill="#c2412d" stroke="#3a1d08" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
